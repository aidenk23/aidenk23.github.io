<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sobre Aiden Jiménez, desarrollador web y diseñador gráfico.">
    <meta name="theme-color" content="#070a10">
    <link rel="icon" href="img/battery.svg" type="image/svg+xml">
    <link rel="preload" href="fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <title>Sobre mí — 303/AIDEN</title>
</head>

<body data-page="about">
    <div class="bg-fx" aria-hidden="true"><div class="bg-fx__grid"></div><div class="bg-fx__glow"></div></div>

    <div data-include="header"></div>

    <main id="main" class="page">
        <section class="section" aria-labelledby="about-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <h1 class="section-title" id="about-title" data-reveal data-scramble><span data-i18n="about.heading"></span></h1>
                </header>

                <div class="about">
                    <div class="about__text" data-reveal>
                        <p class="about__hello" data-about-hello></p>
                        <p class="about__lead" data-about-lead></p>
                        <div class="about__body panel" data-glow>
                            <p data-about-body></p>
                        </div>
                        <dl class="stats" data-stats></dl>
                        <a class="btn btn--primary" data-linkedin target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5v8M6.5 6.5v.01M10.5 17.5v-8m0 3.5c0-2 1.5-3.5 3.5-3.5s3 1.3 3 3.5v4.5"/></svg>
                            <span data-i18n="about.linkedin"></span>
                        </a>
                    </div>

                    <aside class="id-card" data-reveal data-glow>
                        <div class="id-card__photo">
                            <img data-photo alt="" width="400" height="480">
                            <span class="corner corner--tl"></span><span class="corner corner--tr"></span>
                            <span class="corner corner--bl"></span><span class="corner corner--br"></span>
                        </div>
                        <div class="id-card__contact">
                            <h2 class="mono" data-i18n="about.contact"></h2>
                            <ul data-contact-list></ul>
                        </div>
                    </aside>
                </div>
            </div>
        </section>
    </main>

    <div data-include="footer"></div>

    <script src="data/profile.js"></script>
    <script src="data/projects.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sections.js"></script>
</body>
</html>
