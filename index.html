<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Aiden Jiménez, desarrollador web y diseñador gráfico.">
    <meta name="theme-color" content="#070a10">
    <meta property="og:title" content="303/AIDEN — Portfolio">
    <meta property="og:description" content="Desarrollador web & diseñador gráfico · Web developer & graphic designer">
    <meta property="og:image" content="img/projects/fitpup-laravel/cover.jpg">
    <link rel="icon" href="img/battery.svg" type="image/svg+xml">
    <link rel="preload" href="fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <title>303/AIDEN — Portfolio</title>
</head>

<body data-page="home">
    <div class="bg-fx" aria-hidden="true"><div class="bg-fx__grid"></div><div class="bg-fx__glow"></div></div>

    <div data-include="header"></div>

    <main id="main">

        <!-- ============ HOME / HERO ============ -->
        <section class="hero" aria-labelledby="hero-name">
            <div class="container hero__inner">
                <div class="monitor" data-tilt>
                    <div class="monitor__bezel">
                        <div class="monitor__screen">
                            <div class="screen-bar mono" aria-hidden="true">
                                <span class="screen-bar__dots"><i></i><i></i><i></i></span>
                                <span>~/portfolio — zsh</span>
                                <span class="screen-bar__clock" data-clock></span>
                            </div>
                            <div class="screen-body">
                                <div class="screen-text">
                                    <p class="boot mono" aria-hidden="true">&gt; <span data-boot></span><span class="caret">▍</span></p>
                                    <h1 class="hero-name glitch" id="hero-name" data-name></h1>
                                    <p class="hero-titles mono">
                                        <span class="sr-only" data-role></span>
                                        <span aria-hidden="true"><span class="hero-titles__prompt">$</span> <span data-typed></span><span class="caret">▍</span></span>
                                    </p>
                                    <p class="hero-role" data-role-visible></p>
                                </div>
                                <div class="screen-logo">
                                    <img src="img/logo.svg" alt="" width="200" height="200">
                                </div>
                            </div>
                            <div class="screen-scan" aria-hidden="true"></div>
                        </div>
                        <span class="monitor__led" aria-hidden="true"></span>
                    </div>
                    <div class="monitor__neck" aria-hidden="true"></div>
                    <div class="monitor__foot" aria-hidden="true"></div>

                    <aside class="sticky-note" data-sticky>
                        <span class="sticky-note__tape" aria-hidden="true"></span>
                        <p data-sticky-text></p>
                    </aside>
                </div>

                <div class="hero__cta">
                    <p class="status-pill mono" data-status hidden><span class="status-pill__dot"></span><span data-i18n="hero.status"></span></p>
                    <div class="hero__buttons">
                        <a class="btn btn--primary" href="#projects"><span data-i18n="hero.cta.projects"></span> <span aria-hidden="true">→</span></a>
                        <a class="btn btn--ghost" href="#contact" data-i18n="hero.cta.contact"></a>
                    </div>
                </div>
            </div>
            <a class="scroll-hint mono" href="#projects" aria-hidden="true" tabindex="-1"><span data-i18n="hero.scroll"></span><i></i></a>
        </section>

        <!-- ============ PROYECTOS ============ -->
        <section class="section" id="projects" aria-labelledby="projects-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="kicker mono">// 01</p>
                    <h2 class="section-title" id="projects-title" data-reveal data-scramble><span data-i18n="projects.heading"></span></h2>
                    <p class="section-intro" data-i18n="projects.intro"></p>
                </header>

                <div class="filters" role="group" aria-labelledby="projects-title" data-filters data-reveal></div>

                <div class="carousel" data-reveal>
                    <div class="carousel__viewport" tabindex="0" data-track role="list"></div>
                    <p class="carousel__empty" data-empty hidden data-i18n="projects.empty"></p>
                    <div class="carousel__controls">
                        <button class="icon-btn" type="button" data-prev data-i18n-attr="aria-label:projects.prev">←</button>
                        <div class="carousel__progress" aria-hidden="true"><span data-progress></span></div>
                        <span class="carousel__count mono" data-count></span>
                        <button class="icon-btn" type="button" data-next data-i18n-attr="aria-label:projects.next">→</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ============ ABOUT ============ -->
        <section class="section" id="about" aria-labelledby="about-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="kicker mono">// 02</p>
                    <h2 class="section-title" id="about-title" data-reveal data-scramble><span data-i18n="about.heading"></span></h2>
                </header>

                <div class="about">
                    <div class="about__text" data-reveal>
                        <p class="about__hello" data-about-hello></p>
                        <p class="about__lead" data-about-lead></p>
                        <div class="about__body panel" data-glow>
                            <p data-about-body></p>
                        </div>
                        <dl class="stats" data-stats></dl>
                        <a class="btn btn--primary" data-linkedin target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5v8M6.5 6.5v.01M10.5 17.5v-8m0 3.5c0-2 1.5-3.5 3.5-3.5s3 1.3 3 3.5v4.5"/></svg>
                            <span data-i18n="about.linkedin"></span>
                        </a>
                    </div>

                    <aside class="id-card" data-reveal data-glow>
                        <div class="id-card__photo">
                            <img data-photo alt="" width="400" height="480" loading="lazy">
                            <span class="corner corner--tl"></span><span class="corner corner--tr"></span>
                            <span class="corner corner--bl"></span><span class="corner corner--br"></span>
                        </div>
                        <div class="id-card__contact">
                            <h3 class="mono" data-i18n="about.contact"></h3>
                            <ul data-contact-list></ul>
                        </div>
                    </aside>
                </div>
            </div>
        </section>

        <!-- ============ SKILLS + EXPERIENCIA ============ -->
        <section class="section" id="skills" aria-labelledby="skills-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="kicker mono">// 03</p>
                    <h2 class="section-title" id="skills-title" data-reveal data-scramble><span data-i18n="skills.heading"></span></h2>
                </header>

                <div class="skills">
                    <div data-reveal>
                        <h3 class="sub-title mono" data-i18n="skills.software"></h3>
                        <ul class="skill-grid" data-skill-grid></ul>
                    </div>
                    <div data-reveal>
                        <h3 class="sub-title mono" data-i18n="skills.soft"></h3>
                        <ul class="soft-list" data-soft-list></ul>
                    </div>
                </div>
            </div>
        </section>

        <section class="section" id="experience" aria-labelledby="exp-title">
            <div class="container">
                <header class="section-head" data-reveal>
                    <p class="kicker mono">// 04</p>
                    <h2 class="section-title" id="exp-title" data-reveal data-scramble><span data-i18n="exp.heading"></span></h2>
                </header>
                <ol class="timeline" data-experience></ol>

                <h3 class="section-title section-title--sm" data-reveal data-scramble><span data-i18n="exp.studies"></span></h3>
                <ol class="timeline" data-studies></ol>
            </div>
        </section>
    </main>

    <div data-include="footer"></div>

    <script src="data/profile.js"></script>
    <script src="data/projects.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
